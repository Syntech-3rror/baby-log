<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>반짝이</title>
<meta name="theme-color" id="themeColor" content="#F2F4F7">
<script>
(function () {
  var m = 'system';
  try { var v = localStorage.getItem('babylog.v1.theme'); if (v) m = JSON.parse(v); } catch (e) {}
  var dark = m === 'dark' || (m !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('themeColor').setAttribute('content', dark ? '#131A2C' : '#F2F4F7');
})();
</script>
<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--/pwa-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="반짝이">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir@82dc50fce612348f63fc14941b2005b5b88fe287/Cafe24SsurroundAir.woff2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
/* 한글: 카페24 써라운드(보통 굵기는 에어, 굵은 글씨는 써라운드). 숫자와 영문은 Nunito. 카페24 무료 폰트(상업 사용, 웹폰트 가능) */
@font-face{font-family:"Cafe24Ssurround";font-style:normal;font-weight:400;font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir@82dc50fce612348f63fc14941b2005b5b88fe287/Cafe24SsurroundAir.woff2) format("woff2"),url(https://fastly.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir@82dc50fce612348f63fc14941b2005b5b88fe287/Cafe24SsurroundAir.woff2) format("woff2")}
@font-face{font-family:"Cafe24Ssurround";font-style:normal;font-weight:700 800;font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround@e64965ea346934cd6b3f19510703cd429e8e6dc3/Cafe24Ssurround.woff2) format("woff2"),url(https://fastly.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround@e64965ea346934cd6b3f19510703cd429e8e6dc3/Cafe24Ssurround.woff2) format("woff2")}
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#E8ECF1;--ink:#1D2433;--muted:#5F6B7D;--line:#DCE1E8;
  --lamp:#F2B14C;--lamp-ink:#1D2433;--lamp-soft:#FBE9C8;
  --feed:#C98318;--pee:#2F7FC1;--poo:#94612C;--med:#7C50BC;--temp:#D24B42;--vomit:#3F8A63;--grow:#25807D;
  --ok:#2E9B62;--warn:#D98A12;--danger:#C23B33;
  --fever-red:#E03E3E;--fever-blue:#2D6CDF;--food:#D2622F;--photo:#C9467A;
  --cv-feed:#C2770F;--cv-pee:#2F7FC1;--cv-poo:#A8621A;--cv-food:#D2622F;--cv-grow:#0B8C7F;--cv-red:#E03E3E;--cv-blue:#2D6CDF;
  --font:"Nunito","Cafe24Ssurround",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --kb:0px;
}
:root{color-scheme:light}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#131A2C;--surface:#1B2440;--surface-2:#253051;--ink:#ECEFF8;--muted:#A0AAC4;--line:#2C385C;
    --lamp:#FFC56B;--lamp-ink:#18203A;--lamp-soft:#4A3B22;
    --feed:#FFC56B;--pee:#7DBDF5;--poo:#DDAA74;--med:#BEA2F5;--temp:#FF8F85;--vomit:#8CD3A8;--grow:#7DD0CB;
    --ok:#6FD39A;--warn:#FFB547;--danger:#FF7D73;
    --fever-red:#FF7B72;--fever-blue:#7DB0FF;--food:#FFA27A;--photo:#FF96BD;
    --cv-feed:#C4861A;--cv-pee:#4A95DB;--cv-poo:#C77B33;--cv-food:#D9733D;--cv-grow:#16A091;--cv-red:#E5554F;--cv-blue:#4F8FE8;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.num{font-family:"Nunito",var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 6px}
.top-row{display:flex;align-items:center;gap:8px}
.baby{flex:1;min-width:0;padding-left:2px}
.baby h1{margin:0;font-size:26px;line-height:1.2;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby p{margin:1px 0 0;color:var(--muted);font-size:14px;word-break:keep-all}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);font-size:13px;color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill[data-s="ok"] i{background:var(--ok)}
.pill[data-s="wait"] i,.pill[data-s="busy"] i{background:var(--warn)}
.pill[data-s="busy"] i{animation:blink 1s infinite}
.pill[data-s="err"]{color:var(--danger)} .pill[data-s="err"] i{background:var(--danger)}
@keyframes blink{50%{opacity:.25}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:22px;height:22px}
.day-nav{display:flex;align-items:center;gap:2px;margin-top:10px}
.arrow{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.arrow svg{width:22px;height:22px}
.arrow:disabled{opacity:.25;cursor:default}
.day-label{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;font-size:17px;white-space:nowrap}
.day-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.tag{font-size:12px;line-height:1;padding:5px 9px;border-radius:10px;background:var(--lamp-soft)}
.to-today{height:32px;padding:0 12px;border-radius:16px;background:var(--surface);font-size:13px;flex:none}

/* glance */
.glance{margin:4px 16px 0;padding:18px 18px 16px;background:var(--surface);border-radius:24px}
.hero-label{margin:0;color:var(--muted);font-size:14px}
.hero{margin:0;font-size:19px;line-height:1.1;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:4px}
.hero .num{font-size:48px;line-height:1.05}
.hero .soft{color:var(--muted)}
.hero-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.timers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.timer{min-width:0}
.timer .hero-label{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .hero-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.timer .hero{margin-top:2px;font-size:16px;column-gap:3px}
.timer .hero .num{font-size:clamp(28px,8.4vw,40px)}
.timer .hero-sub{margin-top:4px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:16px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.stats div{min-width:0}
.stats dt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stats dt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.stats dd{margin:3px 0 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd .num{font-size:20px}
.stats .hot{color:var(--temp)}
.stats .soft{color:var(--muted)}
.lines{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px;color:var(--muted)}
.lines b{font-weight:400;color:var(--ink)}

/* timeline */
.timeline{flex:1;padding:16px 16px 20px}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 6px}
.tl-head h2{margin:0;font-size:15px;font-weight:400;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:79px;top:14px;bottom:14px;width:2px;border-radius:1px;background:var(--line)}
.tl li{position:relative}
.item{width:100%;display:grid;grid-template-columns:54px 28px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:9px 6px;border-radius:16px}
.item:active{background:var(--surface)}
.item time{text-align:right;line-height:1.05}
.item time small{display:block;font-size:11px;color:var(--muted)}
.item time .num{font-size:17px;font-weight:700}
.ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--c);box-shadow:0 0 0 4px var(--bg)}
.ico svg{width:17px;height:17px}
.what{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.what .t{color:var(--muted)}
.what .num{font-size:18px}
.what.hot .num{color:var(--temp)}
.what.warm .num{color:var(--warn)}
.meta{margin-top:1px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.up{width:18px;height:18px;color:var(--warn)}
.empty{margin:24px 8px;color:var(--muted);font-size:15px;text-align:center}

/* 발열 카드 */
.fever{margin:4px 16px 10px;padding:16px 18px 12px;border-radius:24px;background:var(--surface);background:color-mix(in srgb,var(--temp) 9%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--temp) 30%,transparent)}
.fv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fv-title h2{margin:0;font-size:21px;font-weight:700;color:var(--temp);line-height:1.2}
.fv-title h2 small{margin-left:4px;font-size:15px;font-weight:400;color:var(--ink)}
.fv-title p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.fv-end{flex:none;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.fv-temps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0;padding:12px 0 0;border-top:1px solid color-mix(in srgb,var(--temp) 22%,transparent)}
.fv-temps div{min-width:0}
.fv-temps dt{font-size:13px;color:var(--muted)}
.fv-temps dd{margin:2px 0 0;font-size:16px}
.fv-temps dd .num{font-size:30px;line-height:1.1}
.fv-temps dd.hot{color:var(--temp)} .fv-temps dd.warm{color:var(--warn)}
.fv-temps p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.fv-meds{margin-top:12px}
.lines .soft{color:var(--muted)}
.fv-chart{margin-top:8px;padding-left:0}
.what.fever-mark{color:var(--temp)}
.csum{margin:8px 2px 4px;font-size:13px;color:var(--muted)}

/* 해열제 요약 */
.lines .fever-sub{display:block;margin:-2px 0 3px 14px;font-size:13px;line-height:1.4}
.lines .over{color:var(--danger)}

/* 사진 */
.pics{margin:14px 16px 0}
.pics-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.pics-head h2{margin:0;font-size:15px;font-weight:400;color:var(--muted)}
.pics-head h2 small{margin-left:3px;font-size:13px}
.link-btn{display:inline-flex;align-items:center;gap:1px;padding:2px 0 2px 8px;font-size:14px;color:var(--muted)}
.link-btn svg{width:15px;height:15px}
.strip{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.ptile{position:relative;flex:none;width:76px;height:76px;border-radius:16px;overflow:hidden;background:var(--surface)}
.ptile img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.ptile img.ok{opacity:1}
.ptile.add{display:grid;place-items:center;align-content:center;gap:3px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font-size:12px}
.ptile.add svg{width:24px;height:24px;color:var(--photo)}
.pics-empty{margin:0 0 0 4px;color:var(--muted);font-size:13px;line-height:1.35}
.album-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 4px;color:var(--muted);font-size:14px}
.album-top .chip{display:inline-flex;align-items:center;gap:4px}
.album-top .chip svg{width:16px;height:16px;color:var(--photo)}
.amon{margin:18px 2px 8px;font-size:15px;font-weight:400;color:var(--muted)}
.amon small{margin-left:3px;font-size:13px}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.agrid .ptile,.up-grid .ptile{width:auto;height:auto;aspect-ratio:1/1;border-radius:10px}
.note-box{margin:10px 2px;padding:14px 16px;border-radius:16px;background:var(--surface-2);font-size:14px;line-height:1.5}
.note-box b{display:block;margin-bottom:4px;font-weight:400;font-size:15px}
.up-sum{margin:2px 2px 12px;font-size:16px;line-height:1.4}
.up-sum small{display:block;margin-top:3px;color:var(--muted);font-size:13px}
.up-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.up-grid .ptile img{opacity:1}
.up-grid .ptile[data-s="dup"],.up-grid .ptile[data-s="big"]{opacity:.35}
.up-grid .ptile[data-s="wait"] img{opacity:.55}
.up-grid .ptile[data-s="busy"]{box-shadow:inset 0 0 0 3px var(--lamp)}
.up-grid .ptile .badge{position:absolute;right:4px;bottom:4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:grid;place-items:center;font-size:11px;line-height:1;background:rgba(0,0,0,.6);color:#fff}
.up-grid .ptile[data-s="done"] .badge{background:var(--ok)}
.up-grid .ptile[data-s="fail"] .badge{background:var(--danger)}
.up-grid .ptile .badge:empty{display:none}
.prog{height:8px;margin:14px 2px 6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;width:0;height:100%;background:var(--lamp);transition:width .25s}
.up-msg{margin:0 2px;font-size:14px;color:var(--muted)}
.up-msg.bad{color:var(--danger)}
.memo.up-memo{margin-top:12px}

/* 사진 크게 보기 */
.pv{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:#05070D;color:#F2F4F9;opacity:0;transition:opacity .18s}
.pv.open{opacity:1}
.pv-top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.pv-x{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:inherit;flex:none}
.pv-x svg{width:24px;height:24px}
.pv-title{flex:1;min-width:0;text-align:center;font-size:16px;line-height:1.25}
.pv-title small{display:block;font-size:12px;color:#A7AEC2}
.pv-sp{width:44px;flex:none}
.pv-stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:pinch-zoom}
.pv-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transition:transform .22s,opacity .22s}
.pv-stage img.soft{filter:blur(6px)}
.pv-stage.moving img{transition:none}
.pv-nav{position:absolute;top:50%;width:44px;height:64px;margin-top:-32px;display:grid;place-items:center;color:#fff;opacity:.75}
.pv-nav svg{width:28px;height:28px}
.pv-nav.prev{left:4px} .pv-nav.next{right:4px}
@media (hover:none){.pv-nav{display:none}}
.pv-bottom{padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
.pv-memo{margin:0 6px 8px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.pv-acts{display:flex;gap:6px}
.pv-acts>*{flex:1;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:inherit;font-size:14px;text-decoration:none}
.pv-acts .pv-del{color:#FF9B93}
.pv-acts .pv-del.armed{background:var(--danger);color:#fff}
.pv.bare .pv-top,.pv.bare .pv-bottom{visibility:hidden}
.pv-edit{margin:0 -12px calc(-10px - env(safe-area-inset-bottom));padding:14px 16px calc(12px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
.pv-edit .memo{margin-top:0}
.pv-edit-acts{display:flex;gap:8px;margin-top:12px}
.pv-edit-acts .chip{height:52px;padding:0 20px}
.pv-edit-acts .primary{height:52px}

/* dock */
.dock{position:sticky;bottom:0;z-index:6;background:var(--bg);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}
.dock-main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dock-sub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:70px;border-radius:20px;background:var(--surface);font-size:14px;line-height:1.1;transition:transform .1s}
.add svg{width:27px;height:27px;color:var(--c)}
.add:active{transform:scale(.96)}
.add.main{background:var(--lamp-soft)}
.add.sub{flex-direction:row;gap:6px;height:44px;border-radius:15px;font-size:13.5px;white-space:nowrap}
.add.sub svg{width:20px;height:20px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(8,12,24,.48);opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;width:100%;max-width:560px;margin:0 auto;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px - env(safe-area-inset-top));display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.85,.25,1);padding-bottom:var(--kb)}
.sheet.open{transform:none}
.sheet-head{position:relative;display:flex;align-items:center;gap:10px;padding:20px 16px 6px 18px;touch-action:none;cursor:grab}
.sheet-head .grab{position:absolute;left:50%;top:8px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.sheet.dragging{transition:none}
.sheet-head .ico{box-shadow:none;background:var(--surface-2);width:34px;height:34px}
.sheet-head .ico svg{width:20px;height:20px}
.sheet-head h2{flex:1;margin:0;font-size:21px;font-weight:400}
.close{height:38px;padding:0 12px;border-radius:12px;color:var(--muted);font-size:15px}
.sheet-body{overflow:auto;padding:4px 18px 12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}
.primary{flex:1;height:56px;border-radius:18px;background:var(--lamp);color:var(--lamp-ink);font-size:17px;text-align:center}
.primary:disabled{opacity:.6}
.del{height:56px;padding:0 18px;border-radius:18px;background:var(--surface-2);color:var(--danger);font-size:15px;text-align:center;white-space:nowrap}
.del.armed{background:var(--danger);color:#fff}

.when{display:grid;gap:10px;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.when-row{display:flex;gap:8px}
.when-btn{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:6px 14px;border-radius:18px;background:var(--surface-2);line-height:1.15}
.when-btn small{font-size:12px;color:var(--muted)}
.when-btn span{font-size:17px}
.when-btn .num{font-size:25px}
.when-btn.date input,.tpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;-webkit-appearance:none}
.when-btn.time{flex:1.25;padding-right:54px;cursor:text}
.when-btn.time:has(.tin:not([hidden])){box-shadow:inset 0 0 0 2px var(--lamp)}
.when-btn .wd,.tshow{white-space:nowrap}
.tshow{display:block;width:100%;line-height:1.15;text-align:left}
.tin{width:100%;min-width:0;height:29px;padding:0;border:0;background:none;color:var(--ink);font:800 25px/1.15 "Nunito",var(--font);font-variant-numeric:tabular-nums;letter-spacing:.04em;outline:none}
.tin::placeholder{color:var(--muted);font-weight:700}
.tpick{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:var(--muted)}
.tpick svg{width:24px;height:24px}
.tpick:hover,.tpick:focus-within{color:var(--ink)}
.thint{margin:-2px 2px 0;font-size:13px;color:var(--muted);word-break:keep-all}
.thint.ok{color:var(--ink)}
.thint.bad{color:var(--danger)}
@media (max-width:340px){
  .when-btn{padding:6px 10px} .when-btn span{font-size:15px} .when-btn .num,.tin{font-size:22px}
  .when-btn.time{padding-right:44px} .tpick{right:2px}
}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--surface-2);font-size:14px;white-space:nowrap;text-align:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.when .chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.when .chip{padding:0 4px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.field-head .field-label{margin:0}
.text-btn{height:32px;padding:0 4px;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:4px}
.chip.removable{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--danger);color:var(--danger)}
.chip .x{margin-left:6px;font-size:17px;line-height:1}
.add-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.add-row .text-input{margin-top:0;flex:1}
.add-row .chip{height:50px;padding:0 18px}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.mdot.red{background:var(--fever-red)} .mdot.blue{background:var(--fever-blue)}
.chip[aria-pressed="true"] .mdot{box-shadow:0 0 0 2px var(--surface)}
.chip.dashed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}

.field{padding:16px 0 2px}
.field-label{display:block;margin:0 0 8px;font-size:14px;color:var(--muted)}
.field-label b{font-weight:400;color:var(--ink)}
.hint{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.err{margin:10px 2px 0;font-size:14px;color:var(--danger)}
.err:empty{display:none}

.levels{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:8px}
.level{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;border-radius:18px;background:var(--surface-2);font-size:15px;box-shadow:inset 0 0 0 2px transparent;text-align:center}
.level .bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.level .bars i{display:block;width:6px;border-radius:3px;background:var(--line)}
.level .bars i.on{background:var(--c)}
.level[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c);background:var(--surface)}
@supports (background:color-mix(in srgb,red 10%,white)){
  .level[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,var(--surface))}
}

.num-input{display:flex;align-items:baseline;gap:6px;padding:8px 16px;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 2px transparent}
.num-input:focus-within{box-shadow:inset 0 0 0 2px var(--lamp)}
.num-input input{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;padding:0;font-family:"Nunito",var(--font);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.num-input input::placeholder{color:var(--muted);opacity:.45;font-weight:700}
.num-input .unit{color:var(--muted);font-size:17px;flex:none}
.num-input.huge{padding:10px 18px}
.num-input.huge input{font-size:46px;text-align:center}

/* feeding wheel */
.feed-top{display:flex;align-items:center;gap:16px;padding:8px 0 2px}
.bottle{width:58px;height:116px;flex:none;color:var(--feed)}
.bottle .milk{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.85,.25,1)}
.wheel-wrap{position:relative;flex:1;height:168px;transition:opacity .2s}
.wheel-wrap.off{opacity:.35}
.wheel-band{position:absolute;z-index:0;left:0;right:0;top:56px;height:56px;border-radius:16px;background:var(--lamp-soft);display:flex;align-items:center;justify-content:flex-end;padding-right:16px;color:var(--muted);font-size:17px}
.wheel{position:relative;z-index:1;height:168px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 70%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 70%,transparent 100%);outline:none}
.wheel::-webkit-scrollbar{display:none}
.wheel-pad{height:56px}
.wheel-item{height:56px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:"Nunito",var(--font);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;transform:scale(calc(1 - var(--d,0) * .22));opacity:calc(1 - var(--d,0) * .55);cursor:pointer;user-select:none;-webkit-user-select:none}
.wheel:focus-visible + .wheel-band{box-shadow:inset 0 0 0 2px var(--lamp)}
.direct{display:flex;align-items:center;gap:12px;margin-top:12px}
.direct .field-label{margin:0;white-space:nowrap}
.direct .num-input{flex:1}
.direct .num-input input::placeholder{font-size:20px}

.memo-toggle{margin-top:16px;height:36px;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:4px}
textarea.memo{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;background:var(--surface-2);padding:12px 14px;resize:none;outline:none;line-height:1.45;min-height:72px}
textarea.memo:focus{box-shadow:inset 0 0 0 2px var(--lamp)}

/* settings */
.set{padding:16px 0;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
.set h3{margin:0 0 10px;font-size:15px;font-weight:400;color:var(--muted)}
.intro{margin:4px 0 6px;font-size:15px;line-height:1.55}
.lbl{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.lbl:first-of-type{margin-top:0}
.text-input{display:block;width:100%;height:50px;margin-top:6px;border:0;border-radius:15px;background:var(--surface-2);padding:0 14px;outline:none;color:var(--ink);font-size:16px}
.text-input:focus{box-shadow:inset 0 0 0 2px var(--lamp)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.note{margin:10px 2px 0;font-size:14px;color:var(--muted)}
.note.ok{color:var(--ok)} .note.bad{color:var(--danger)}
.ver{margin:14px 2px 4px;font-size:12px;color:var(--muted)}
.choice{display:grid;gap:8px;margin-top:4px}
.choice .primary,.choice .del{width:100%}

/* charts */
.sheet.tall{height:calc(100vh - 20px);height:calc(100dvh - 20px - env(safe-area-inset-top))}
.sheet.tall .sheet-body{flex:1;padding-top:0}
.cbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;min-height:56px;margin:0 -18px;padding:0 18px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.cbar .text-btn{margin-left:auto;white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:20px;background:var(--surface-2)}
.seg button{height:34px;min-width:52px;padding:0 10px;border-radius:17px;font-size:14px;color:var(--muted);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(8,12,24,.14)}
.cnote{display:flex;justify-content:space-between;gap:10px;margin:12px 2px 0;font-size:13px;color:var(--muted)}
.cnote b{font-weight:400;color:var(--warn);white-space:nowrap}
.cwarn{margin:8px 2px 0;font-size:13px;color:var(--danger)}
.cset{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.cset h3{margin:0;font-size:18px;font-weight:400;display:flex;align-items:baseline;gap:8px}
.cset h3 small{font-size:13px;color:var(--muted)}
.readout{height:46px;margin:10px 0 6px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.readout .rl{font-size:13px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .rv{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .rv .num{font-size:21px}
.readout .rv.soft{font-size:14px;color:var(--muted)}
.readout .rs{color:var(--muted);font-size:14px}
.chart{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chart svg{overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:"Nunito",var(--font);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .day{fill:none;stroke-width:1.5;stroke-linejoin:round;opacity:.32}
.chart .avg{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .avg.thin{stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .dl{fill:var(--ink);font-size:12px;font-family:"Nunito",var(--font);font-weight:800}
.chart .ring{fill:none;stroke:var(--ink);stroke-width:2}
.clabel{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.swatch.dot{border-radius:50%}
.swatch.line{width:14px;height:2px;border-radius:1px}
.swatch.vline{width:0;height:13px;border-radius:0;border-left:1.5px dashed;background:none}
.chart .dose{stroke-width:1.5;stroke-dasharray:4 3;opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cempty{margin:10px 0 0;font-size:14px;color:var(--muted)}
.cfoot{margin:16px 2px 8px;font-size:13px;color:var(--muted)}
.cload{margin:28px 2px;font-size:15px;color:var(--muted);text-align:center}
.ctable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.ctable th{position:sticky;top:56px;z-index:2;background:var(--surface);padding:8px 3px 6px;font-size:12px;font-weight:400;color:var(--muted);text-align:right;line-height:1.2;box-shadow:0 1px 0 var(--line);white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{text-align:left;padding-left:2px}
.ctable td{padding:9px 3px;text-align:right;border-bottom:1px solid var(--line);font-family:"Nunito",var(--font);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctable td:first-child{font-family:var(--font);font-weight:400}
.ctable td.na{color:var(--muted);font-weight:400}
.ctable td.hot{color:var(--temp)}
.ctable tr.today td:first-child{color:var(--muted)}

/* toast */
.toast{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(150px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:16px;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:15px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{color:var(--lamp);white-space:nowrap;font-size:15px}
:root[data-theme="dark"] .toast button{color:#C27C0E}

@media (max-width:380px){
  .top-row{gap:4px}
  .icon-btn{width:36px}
  .pill{padding:0 10px}
}
@media (max-width:359px){
  .add{height:64px;font-size:13px}
  .hero .num{font-size:42px}
  .stats dd .num{font-size:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="baby">
        <h1 id="babyName">반짝이</h1>
        <p id="babyAge"></p>
      </div>
      <button class="pill" id="syncPill" type="button" data-s="local"><i></i><span>이 폰에만 저장</span></button>
      <button class="icon-btn" id="chartBtn" type="button" aria-label="그래프"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="설정"></button>
    </div>
    <nav class="day-nav" aria-label="날짜 이동">
      <button class="arrow" id="prevDay" type="button" aria-label="전날"></button>
      <label class="day-label"><span id="dayText"></span><span class="tag" id="dayTag"></span><input type="date" id="dayInput" aria-label="날짜 고르기"></label>
      <button class="arrow" id="nextDay" type="button" aria-label="다음날"></button>
    </nav>
  </header>

  <main>
    <section class="fever" id="fever" aria-label="발열" hidden></section>
    <section class="glance" id="glance" aria-live="polite"></section>
    <section class="pics" id="pics" aria-label="사진"></section>
    <section class="timeline">
      <div class="tl-head"><h2 id="tlTitle">기록</h2><button class="to-today" id="todayBtn" type="button" hidden>오늘로</button></div>
      <ul class="tl" id="tl"></ul>
    </section>
  </main>

  <nav class="dock" id="dock" aria-label="기록 남기기"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

const PREVIEW = false;          // 미리보기용 복사본에서만 true
const VERSION = '1.4.1';
const KEY = 'babylog.v1.';

/* ---------- 기본 정보 ---------- */
const META = {
  '수유':   { label:'수유',      color:'feed',  icon:'bottle' },
  '소변대변': { label:'소변/대변', color:'pee',   icon:'diaper' },
  '체온':   { label:'체온',      color:'temp',  icon:'thermo' },
  '투약':   { label:'투약',      color:'med',   icon:'pill' },
  '토':     { label:'토',        color:'vomit', icon:'queasy' },   // 예전 기록(1.3.x)만. 새로 넣는 건 '증상'
  '증상':   { label:'증상',      color:'vomit', icon:'queasy' },   // 약이름 칸에 토, 콧물, 기침(여러 개), 정도 칸에 조금/보통/많이
  '이유식':  { label:'이유식',    color:'food',  icon:'bowl' },
  '체중':   { label:'체중',      color:'grow',  icon:'scale' },
  '키':     { label:'키',        color:'grow',  icon:'ruler' },
  '발열':   { label:'발열 체크', color:'temp',  icon:'thermo' },   // 발열 기간 시작/끝 표시(정도 칸에 '시작' 또는 '끝')
};
const FEED_PRESETS = [70, 110, 140, 150, 180];
const LEVELS_PEE = ['소량', '보통', '묵직', '왕묵직'];
const LEVELS_POO = ['소량', '보통', '푸짐', '왕푸짐'];
const FOOD_SEEDS = ['미음', '소고기'];
const LEVELS3 = ['조금', '보통', '많이'];
const SYMPTOMS = ['토', '콧물', '기침'];
const FEVER_SEEDS = ['해열제 빨강', '해열제 파랑'];
const MED_SEEDS = ['감기약', '유산균'];
const MED_UNITS = ['ml', '방울', '포'];

const ICONS = {
  bottle:'<path d="M10.4 4.9V3.3c0-.9.7-1.6 1.6-1.6s1.6.7 1.6 1.6v1.6"/><path d="M8.3 4.9h7.4v2.4H8.3z"/><path d="M9 7.3h6c.9 1.1 1.6 2.4 1.6 3.8v8a2.4 2.4 0 0 1-2.4 2.4H9.8a2.4 2.4 0 0 1-2.4-2.4v-8c0-1.4.7-2.7 1.6-3.8z"/><path d="M7.4 13.2h3.2M7.4 16.4h2.2"/>',
  diaper:'<path d="M3 7.2h18v2.6c0 5.2-4 9.4-9 9.4s-9-4.2-9-9.4z"/><path d="M8.2 7.2v3.4M15.8 7.2v3.4"/><path d="M9.3 14.6c1.6 1 3.8 1 5.4 0"/>',
  thermo:'<path d="M10 14.2V5a2 2 0 1 1 4 0v9.2a4 4 0 1 1-4 0z"/><path d="M12 10.5v6"/>',
  pill:'<rect x="2.6" y="8.4" width="18.8" height="7.2" rx="3.6" transform="rotate(-45 12 12)"/><path d="M9.45 9.45l5.1 5.1"/>',
  queasy:'<circle cx="12" cy="12" r="9"/><path d="M8.6 9.6h.01M15.4 9.6h.01"/><path d="M7.6 15.6q1.1-1.2 2.2 0t2.2 0 2.2 0 2.2 0"/>',
  scale:'<rect x="3.5" y="4" width="17" height="16" rx="4"/><path d="M8.4 10.2a5 5 0 0 1 7.2 0"/><path d="M12 11.2l1.7-2.1"/>',
  ruler:'<path d="M3.8 15.6L15.6 3.8l4.6 4.6L8.4 20.2z"/><path d="M7.7 11.7l1.6 1.6M10.3 9.1l1.6 1.6M12.9 6.5l1.6 1.6"/>',
  bowl:'<path d="M3.2 11.5h17.6c0 4.6-3.9 8.3-8.8 8.3s-8.8-3.7-8.8-8.3z"/><path d="M8.5 21.2h7"/><path d="M13.6 11.2l4.6-7.6"/><path d="M7.4 8.6c0-1.1.9-1.3.9-2.4M10.6 8.6c0-1.1.9-1.3.9-2.4"/>',
  gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  chart:'<path d="M4 20h16"/><path d="M7.5 16.5v-5M12 16.5V6.5M16.5 16.5v-8"/>',
  clock:'<circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l2.9 2"/>',
  photo:'<rect x="3.2" y="5" width="17.6" height="14" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="M4.6 17.4l4.6-4.4 3.2 3 2.6-2.4 4.4 4"/>',
  plus:'<path d="M12 5.5v13M5.5 12h13"/>',
  close:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  left:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  right:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
  up:'<path d="M12 18V7M7.5 11.5L12 7l4.5 4.5"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

/* ---------- 저장소 (막혀 있어도 동작) ---------- */
const mem = {};
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(KEY + k); if (v != null) return JSON.parse(v); } catch (e) {}
    return (k in mem) ? mem[k] : d;
  },
  set(k, v) { mem[k] = v; try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
};

let cfg = Object.assign({ babyName:'', birth:'', who:'', apiUrl:'', code:'' }, store.get('config', {}));

/* ---------- 화면 테마: 화이트, 블랙, 시스템(폰 설정 따라감) ---------- */
const THEME_LABELS = { light:'화이트', dark:'블랙', system:'시스템' };
let themePref = THEME_LABELS[store.get('theme', 'system')] ? store.get('theme', 'system') : 'system';
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;

const pad = (n) => String(n).padStart(2, '0');
const dstr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const tstr = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => dstr(new Date());
const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const toDate = (date, time) => { const [y, m, d] = date.split('-').map(Number); const [hh, mm] = time.split(':').map(Number); return new Date(y, m - 1, d, hh, mm); };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const md = (s) => { const d = parseD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
function dayWord(s) {
  const t = todayStr();
  if (s === t) return '오늘';
  if (s === addDays(t, -1)) return '어제';
  if (s === addDays(t, -2)) return '그저께';
  return '';
}
function ampm(time) {
  const [h, m] = time.split(':').map(Number);
  return { ap: h < 12 ? '오전' : '오후', hm: `${h % 12 === 0 ? 12 : h % 12}:${pad(m)}` };
}
function spanText(ms) {
  const min = Math.max(0, Math.floor(ms / 60000));
  const h = Math.floor(min / 60), m = min % 60;
  return { h, m, min };
}
function ageText(birth) {
  if (!birth || !/^\d{4}-\d{2}-\d{2}$/.test(birth)) return '';
  const b = parseD(birth), t = parseD(todayStr());
  const days = Math.round((t - b) / 86400000);
  if (days < 0) return '';
  let months = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
  if (t.getDate() < b.getDate()) months -= 1;
  return `${days + 1}일째, 생후\u00a0${months}개월`;
}

const feverTone = (name) => (/빨강|빨간/.test(name || '') ? 'red' : /파랑|파란/.test(name || '') ? 'blue' : '');

/* ---------- 기록 다루기 ---------- */
const recordsOn = (date) => Object.values(records).filter((r) => r.date === date).sort(byTimeDesc);
const pendingIds = () => new Set(outbox.map((o) => o.id));
const newer = (a, b) => !b || keyOf(a) > keyOf(b) || (keyOf(a) === keyOf(b) && String(a.createdAt || '') > String(b.createdAt || ''));
function latestWhere(type, pred) {
  let best = null;
  for (const id in records) { const r = records[id]; if (r.type === type && pred(r) && newer(r, best)) best = r; }
  const s = latestServer[type];
  if (s && !outbox.some((o) => o.id === s.id && o.op === 'delete')) {
    const cand = records[s.id] || s;
    if (cand.type === type && pred(cand) && newer(cand, best)) best = cand;
  }
  return best;
}
const latestOf = (type) => latestWhere(type, () => true);
function queue(op) {
  outbox = outbox.filter((o) => o.id !== op.id);
  outbox.push(op);
  saveOutbox();
}
function putRecord(rec) {
  const now = new Date().toISOString();
  rec.updatedAt = now;
  if (!rec.createdAt) rec.createdAt = now;
  records[rec.id] = rec;
  saveRecords();
  queue({ op:'save', id:rec.id, record:rec });
  if (rec.type === '투약' && rec.name) rememberMed(rec.name);
  render();
  scheduleSync();
}
function removeRecord(id) {
  const old = records[id];
  delete records[id];
  saveRecords();
  for (const t in latestServer) if (latestServer[t] && latestServer[t].id === id) delete latestServer[t];
  store.set('latest', latestServer);
  queue({ op:'delete', id });
  render();
  scheduleSync();
  return old;
}
function rememberMed(name) {
  medNames = [name].concat(medNames.filter((n) => n !== name)).slice(0, 8);
  store.set('meds', medNames);
}
function normalize(r) {
  const amount = (r.amount === '' || r.amount == null || isNaN(r.amount)) ? '' : Number(r.amount);
  return {
    id:String(r.id), date:String(r.date), time:String(r.time).slice(0, 5), type:String(r.type), amount,
    unit:r.unit || '', pee:r.pee || '', poo:r.poo || '', level:r.level || '', name:r.name || '', memo:r.memo || '',
    who:r.who || '', createdAt:r.createdAt || '', updatedAt:r.updatedAt || '',
  };
}
function pruneCache() {
  const keepFrom = addDays(todayStr(), -120);
  const pend = pendingIds();
  for (const id in records) if (records[id].date < keepFrom && !pend.has(id) && records[id].date !== view) delete records[id];

/* ---------- 발열 기간(1차, 2차 ...) ---------- */
// '발열' 기록: 정도 칸이 '시작'이면 발열 기간 시작, '끝'이면 끝. 시작 순서대로 1차, 2차.
let feverSrv = store.get('fevers', []);
const feverAt = (r) => `${r.date} ${r.time} ${r.createdAt || ''}`;
function feverRecs() {
  const map = new Map();
  feverSrv.forEach((r) => map.set(r.id, r));
  Object.values(records).forEach((r) => { if (r.type === '발열') map.set(r.id, r); });
  outbox.forEach((o) => { if (o.op === 'delete') map.delete(o.id); });
  return Array.from(map.values()).sort((a, b) => feverAt(a).localeCompare(feverAt(b)));
}
function feverEpisodes() {
  const eps = [];
  let cur = null;
  feverRecs().forEach((r) => {
    if (r.level === '끝') { if (cur) { cur.end = r; cur = null; } return; }
    if (cur) { cur.more.push(r); return; }   // 발열 중에 또 '시작'(두 폰에서 같이 누른 경우 등)은 같은 발열로 봄
    cur = { n:eps.length + 1, start:r, end:null, more:[] };
    eps.push(cur);
  });
  return eps;
}
function activeFever() {
  const eps = feverEpisodes();
  const last = eps[eps.length - 1];
  return last && !last.end ? last : null;
}
/* 체온을 48시간 넘게 안 재면 발열을 끝냄. 시트와 막 맞춘 뒤에만 판단(다른 폰 기록을 모른 채 끝내지 않게).
   끝 시각은 마지막 체온(없으면 발열 시작) 시각. id를 시작 기록에서 정해 두 폰이 같이 끝내도 한 줄만 남음 */
const FEVER_IDLE_MS = 48 * 3600000;
function autoEndFever() {
  const ep = activeFever();
  if (!ep) return;
  const at = (r) => toDate(r.date, r.time).getTime();
  const temp = latestOf('체온');
  const ref = Math.max(at(ep.start), ...ep.more.map(at), temp ? at(temp) : 0);
  if (!isFinite(ref) || Date.now() - ref < FEVER_IDLE_MS) return;
  const d = new Date(ref);
  putRecord({ id:`${ep.start.id.slice(0, 34)}-auto`, date:dstr(d), time:tstr(d), type:'발열', amount:'', unit:'', pee:'', poo:'',
    level:'끝', name:'', memo:'체온 기록이 48시간 없어 자동으로 끝냄', who:'' });
  toast(`체온 기록이 48시간 없어서 ${ep.n}차 발열을 끝냈어요`);
}
const episodeOn = (date) => feverEpisodes().find((e) => e.start.date <= date && (!e.end || e.end.date >= date));
function feverNo(r) {
  const eps = feverEpisodes();
  const hit = eps.find((e) => e.start.id === r.id || (e.end && e.end.id === r.id) || e.more.some((x) => x.id === r.id));
  if (hit) return hit.n;
  const last = eps[eps.length - 1];
  if (r.level === '끝') return last ? last.n : 1;   // 짝 없는 '끝'은 마지막 발열 번호로
  return last && !last.end ? last.n : eps.length + 1;
}

/* ---------- 구글 시트와 주고받기 ---------- */
const connected = () => !PREVIEW && !!cfg.apiUrl && !!cfg.code;
let syncing = false, syncAgain = false, syncError = '', syncTimer = 0;

async function api(action, payload, conf, timeoutMs) {
  const c = conf || cfg;
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => ctrl && ctrl.abort(), timeoutMs || 25000);
  let res;
  try {
    res = await fetch(c.apiUrl, { method:'POST', body:JSON.stringify(Object.assign({ action, code:c.code, v:VERSION }, payload || {})), signal:ctrl ? ctrl.signal : undefined, redirect:'follow' });
  } catch (e) {
    const err = new Error('network'); err.code = navigator.onLine === false ? 'offline' : 'network'; throw err;
  } finally { clearTimeout(timer); }
  let data;
  try { data = await res.json(); } catch (e) { const err = new Error('bad_response'); err.code = 'bad_response'; throw err; }
  if (!data || !data.ok) { const err = new Error((data && data.error) || 'error'); err.code = (data && data.error) || 'error'; throw err; }
  return data;
}

function scheduleSync(delay) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay == null ? 400 : delay);
}

async function sync() {
  if (!connected()) { updatePill(); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; updatePill();
  let fresh = false;
  try {
    let guard = 0;
    const later = [];   // 예전 연결 코드가 모르는 종류(발열)는 코드를 바꿀 때까지 이 폰에 두고 다시 보냄
    while (outbox.length && guard++ < 20) {
      const batch = outbox.slice(0, 40);
      const res = await api('batch', { ops:batch.map((o) => (o.op === 'save' ? { op:'save', record:o.record } : { op:'delete', id:o.id })) });
      const sent = new Set(batch);
      outbox = outbox.filter((o) => !sent.has(o));
      (res.results || []).forEach((x) => { if (!x.ok && x.error === 'bad_type') { const o = batch.find((b) => b.id === x.id); if (o) later.push(o); } });
      saveOutbox();
      if (res.results && res.results.some((x) => !x.ok)) console.warn('일부 기록을 시트가 받지 않았어요', res.results);
    }
    if (later.length) { outbox = later.concat(outbox); saveOutbox(); }
    if (foodsDirty) {
      const ver = foodsVer;
      await api('prefs', { foods:foodList });
      if (ver === foodsVer) { foodsDirty = false; store.set('foodsDirty', false); }
    }
    const act = activeFever();
    const from = act && act.start.date < addDays(view, -2) && view === todayStr() ? act.start.date : addDays(view, -2), to = view;
    const res = await api('sync', { from, to, photosVer });
    if (Array.isArray(res.fevers)) { feverSrv = res.fevers.map(normalize); store.set('fevers', feverSrv); }
    if (res.photosVer === undefined) photoSupport = 'no';   // 사진 기능이 없는 예전 연결 코드
    else {
      photoSupport = 'yes';
      if (Array.isArray(res.photos)) setPhotos(res.photos.map(normPhoto).filter((x) => x.id));
      photosVer = res.photosVer;
    }
    savePhotos();
    if (res.prefs && Array.isArray(res.prefs.foods) && !foodsDirty) { foodList = res.prefs.foods.slice(0, 40); store.set('foods', foodList); }
    const pend = pendingIds();
    const seen = new Set();
    (res.records || []).forEach((r) => { const n = normalize(r); seen.add(n.id); if (!pend.has(n.id)) records[n.id] = n; });
    for (const id in records) {
      const r = records[id];
      if (r.date >= from && r.date <= to && !seen.has(id) && !pend.has(id)) delete records[id];
    }
    latestServer = {};
    for (const t in (res.latest || {})) latestServer[t] = normalize(res.latest[t]);
    store.set('latest', latestServer);
    pruneCache();
    saveRecords();
    syncError = '';
    fresh = true;
    const act2 = activeFever();
    if (act2 && view === todayStr() && act2.start.date < from) syncAgain = true;   // 발열 시작일부터 다시 받기
  } catch (e) {
    syncError = e.code || 'network';
  } finally {
    syncing = false;
    render();
    if (fresh) autoEndFever();
    if (syncAgain) { syncAgain = false; scheduleSync(50); }
  }
}

function updatePill() {
  const pill = $('#syncPill');
  let s = 'local', text = '이 폰에만 저장';
  const n = outbox.length;
  if (PREVIEW) { s = 'local'; text = '미리보기'; }
  else if (!connected()) { s = 'local'; text = n ? `이 폰에만 저장, ${n}건` : '이 폰에만 저장'; }
  else if (syncing) { s = 'busy'; text = '업데이트 중'; }
  else if (syncError === 'bad_code') { s = 'err'; text = '가족 코드 확인'; }
  else if (syncError === 'offline' || syncError === 'network') { s = 'wait'; text = n ? `오프라인, ${n}건 대기` : '오프라인'; }
  else if (syncError) { s = 'err'; text = '연결 확인 필요'; }
  else if (n) { s = 'wait'; text = `${n}건 대기`; }
  else { s = 'ok'; text = '업데이트 완료'; }
  pill.dataset.s = s;
  pill.querySelector('span').textContent = text;
}

/* 해열제 하루 최대: 제품 라벨 기준(약학정보원 허가정보, 2026-11 확인)
   빨강 챔프시럽: 아세트아미노펜 32mg/mL, '1일 5회 (75mg/kg)를 초과하여 복용하지 않는다'
   파랑 챔프이부펜시럽: 이부프로펜 20mg/mL, 연령별 1일 최대량 표가 1~2세부터(1~2세 20mL, 3~6세 30mL, 7~10세 40mL, 11~14세 50mL) */
function ageMonthsNow() {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(cfg.birth || '')) return null;
  const b = parseD(cfg.birth), t = new Date();
  return (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth()) - (t.getDate() < b.getDate() ? 1 : 0);
}
function feverSub(tone) {
  const doses = Object.values(records).filter((r) => r.type === '투약' && feverTone(r.name) === tone);
  const now = Date.now();
  const today = doses.filter((r) => r.date === todayStr());
  const in24 = doses.filter((r) => { const t = toDate(r.date, r.time).getTime(); return t > now - 86400000 && t <= now + 60000; });
  const mlOf = (r) => ((r.unit || 'ml') === 'ml' && hasAmount(r) ? Number(r.amount) : null);
  const sum = (l) => l.reduce((a, r) => a + (mlOf(r) || 0), 0);
  const amt = (l) => `${l.length}회${l.length && l.every((r) => mlOf(r) != null) ? ` ${fmt(sum(l), 1)}ml` : ''}`;
  const same = in24.length === today.length && in24.every((r) => today.includes(r));
  const used = `오늘 ${amt(today)}${same ? '' : ` (24시간 안 ${amt(in24)})`}`;
  let cap = '', over = false;
  if (tone === 'red') {
    const w = latestOf('체중');
    const maxMl = w && hasAmount(w) ? Math.floor((Number(w.amount) * 75 / 32) * 10) / 10 : 0;
    cap = maxMl ? `하루 최대 5회 ${fmt(maxMl, 1)}ml (챔프시럽 라벨, ${fmt(w.amount, 2)}kg 기준)` : '하루 최대 5회 (챔프시럽 라벨, 체중을 기록하면 ml도 보여줘요)';
    over = [today, in24].some((l) => l.length > 5 || (maxMl > 0 && sum(l) > maxMl));
  } else {
    const mo = ageMonthsNow();
    const y = mo == null ? null : Math.floor(mo / 12);
    if (y == null) cap = '생일을 설정하면 라벨 기준을 보여줘요';
    else if (y < 1) cap = '만 1세 전에는 라벨에 용량이 없어 의사 지시대로';
    else if (y <= 14) {
      const capMl = y >= 11 ? 50 : y >= 7 ? 40 : y >= 3 ? 30 : 20;
      cap = `하루 최대 ${capMl}ml (챔프이부펜시럽 라벨, 만 ${y}세)`;
      over = [today, in24].some((l) => sum(l) > capMl);
    } else cap = '라벨 용량표를 확인해 주세요';
  }
  return `<span class="fever-sub${over ? ' over' : ''}">${esc(used)}, ${esc(cap)}${over ? ', 하루 최대를 넘었어요' : ''}</span>`;
}

/* 아래 기록 버튼: 평소에는 체온 대신 이유식과 '발열 체크', 발열 중에는 체온 */

};
let dockSig = '';
function renderDock() {

/* '방금', '25분 전', '3시간 전', '3시간 5분 전', '2일 전' */
function agoText(ms) {
  const sp = spanText(ms);
  if (sp.min < 1) return '방금';
  if (sp.h >= 48) return `${Math.floor(sp.h / 24)}일 전`;
  if (sp.h >= 12) return `${sp.h}시간 전`;   // 반나절이 넘으면 분은 빼서 짧게
  return `${sp.h ? `${sp.h}시간` : ''}${sp.h && sp.m ? ' ' : ''}${sp.m || !sp.h ? `${sp.m}분` : ''} 전`;
}

/* 발열 카드: 발열 기간에만 오늘 화면 맨 위에 */
function feverMedHtml(tone, ep) {

  const since = new Date(toDate(ep.start.date, ep.start.time).getTime() - 86400000);
  const sinceKey = `${dstr(since)} ${tstr(since)}`;
  const last = latestWhere('투약', (r) => feverTone(r.name) === tone && keyOf(r) >= sinceKey);
  const name = tone === 'red' ? '해열제 빨강' : '해열제 파랑';
  let head;
  if (last) {
    const ago = agoText(Date.now() - toDate(last.date, last.time));
    const t = ampm(last.time);
    const day = last.date === todayStr() ? '' : `${dayWord(last.date) || md(last.date)} `;
    head = `${medDot(last.name)}<b>${esc(last.name || name)}${hasAmount(last) ? ` ${esc(fmt(last.amount, 2))}${esc(last.unit || 'ml')}` : ''}</b>, ${ago} (${esc(day)}${t.ap} ${t.hm})`;
  } else {
    head = `<i class="mdot ${tone}" aria-hidden="true"></i>${name} <span class="soft">이번 발열에는 기록 없음</span>`;
  }
  return `<li>${head}</li><li>${feverSub(tone)}</li>`;
}

function renderGlance() {
  const list = recordsOn(view);

  const tempVal = !temps.length ? null : isToday ? Number(temps[0].amount) : temps.reduce((a, r) => a + Number(r.amount), 0) / temps.length;

      if (!rec) return `<div class="timer" style="--c:var(--${color})"><p class="hero-label">${label}</p><p class="hero"><span class="soft">기록 없음</span></p></div>`;

      const t = ampm(rec.time);

    };

    hero = `<div class="timers">${timer(lf, '마지막 수유부터', 'feed', lf ? `${fmt(lf.amount, 0)}ml` : '')}${timer(ld, '마지막 기저귀부터', ld && ld.poo && !ld.pee ? 'poo' : 'pee', ld ? kind(ld) : '')}</div>`;
  } else {

      <p class="hero"><span class="num">${total}</span><span>ml</span></p>
      <p class="hero-sub">${feeds.length}회</p>`;
  }

  const foods = list.filter((r) => r.type === '이유식');
  const foodG = foods.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
  const showTemp = temps.length > 0 || (isToday && !!activeFever());
  const fourth = showTemp
    ? `<div style="--c:var(--temp)"><dt>${isToday || !temps.length ? '체온' : '평균 체온'}</dt><dd class="${tempShow && tempClass(tempShow) === 'hot' ? 'hot' : ''}">${tempShow ? `<span class="num">${esc(tempShow)}</span>℃` : '<span class="soft">없음</span>'}</dd></div>`
    : `<div style="--c:var(--food)"><dt>이유식</dt><dd>${foods.length ? `<span class="num">${foods.length}</span>회${foodG ? ` ${foodG}g` : ''}` : '<span class="soft">없음</span>'}</dd></div>`;
  const stats = `<dl class="stats">
    <div style="--c:var(--feed)"><dt>수유</dt><dd><span class="num">${total}</span>ml</dd></div>
    <div style="--c:var(--pee)"><dt>소변</dt><dd><span class="num">${pee}</span>회</dd></div>
    <div style="--c:var(--poo)"><dt>대변</dt><dd><span class="num">${poo}</span>회</dd></div>

  </dl>`;

  const lines = [];
  if (isToday) {
    const medLine = (med, label) => {
      if (!med) return;
      const ms = Date.now() - toDate(med.date, med.time);
      if (ms >= 36 * 3600000) return;
      const ago = agoText(ms);
      const t = ampm(med.time);
      lines.push(`${medDot(med.name)}${label} <b>${esc(med.name || '약')}${hasAmount(med) ? ` ${esc(fmt(med.amount, 2))}${esc(med.unit || 'ml')}` : ''}</b>, ${ago} (${t.ap} ${t.hm})`);

  if (!isToday) {

  }
  $('#glance').innerHTML = hero + stats + (lines.length ? `<ul class="lines">${lines.map((l) => `<li>${l}</li>`).join('')}</ul>` : '');
}

/* ---------- 시트(아래에서 올라오는 창) ---------- */
let sheet = null;
let ignorePop = 0;
const useHistory = !PREVIEW && typeof history !== 'undefined' && !!history.pushState;

function openSheet({ title, iconName, color, body, footer, onClose, tall }) {
  closeSheet(true);
  $('#toast').classList.remove('show');
  const back = h('div', { class:'backdrop' });
  const box = h('section', { class:`sheet${tall ? ' tall' : ''}`, role:'dialog', 'aria-modal':'true', 'aria-label':title });
  const head = h('header', { class:'sheet-head' }, `<span class="grab" aria-hidden="true"></span>${iconName ? `<span class="ico" style="--c:var(--${color || 'ink'})">${icon(iconName)}</span>` : ''}<h2>${esc(title)}</h2>`);
  const x = h('button', { class:'close', type:'button' }, '닫기');
  head.appendChild(x);
  const bodyWrap = h('div', { class:'sheet-body' });
  bodyWrap.appendChild(body);
  box.appendChild(head); box.appendChild(bodyWrap);
  if (footer) box.appendChild(footer);
  document.body.appendChild(back); document.body.appendChild(box);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { back.classList.add('open'); box.classList.add('open'); });
  sheet = { back, box, onClose, pushed:false };
  back.addEventListener('click', () => closeSheet());
  x.addEventListener('click', () => closeSheet());
  dragClose(head, box, back);
  if (useHistory) { try { history.pushState({ babylogSheet:1 }, ''); sheet.pushed = true; } catch (e) {} }
  return box;
}
function closeSheet(silent, fromPop) {
  if (!sheet) return;
  const s = sheet; sheet = null;
  s.back.classList.remove('open'); s.box.classList.remove('open');
  setTimeout(() => { s.back.remove(); s.box.remove(); }, 280);
  document.body.style.overflow = '';
  if (s.pushed && !fromPop) { try { ignorePop++; history.back(); } catch (e) { ignorePop = Math.max(0, ignorePop - 1); } }
  if (!silent && s.onClose) s.onClose();
}
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  if (viewer) { closeViewer(true); return; }
  if (sheet) closeSheet(false, true);
});
document.addEventListener('keydown', (e) => {
  if (viewer) {
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); return; }
    if (e.target && e.target.closest && e.target.closest('textarea,input')) return;
    if (e.key === 'ArrowLeft') viewer.show(viewer.idx - 1);
    else if (e.key === 'ArrowRight') viewer.show(viewer.idx + 1);
    return;
  }
  if (e.key === 'Escape' && sheet) closeSheet();
});

/* 창 머리(제목)를 아래로 끌면 닫기. 조금만 끌면 제자리로 */
function dragClose(handle, box, back) {
  let pid = null, y0 = 0, dy = 0, t0 = 0, drag = false, swallow = 0;
  handle.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pid = e.pointerId; y0 = e.clientY; dy = 0; t0 = performance.now(); drag = false;
  });
  handle.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    dy = Math.max(0, e.clientY - y0);
    if (!drag && dy > 8) { drag = true; box.classList.add('dragging'); try { handle.setPointerCapture(pid); } catch (err) {} }
    if (drag) { box.style.transform = `translateY(${dy}px)`; back.style.opacity = String(Math.max(0.15, 1 - dy / 450)); }
  });
  const end = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (!drag) return;
    drag = false;
    swallow = performance.now() + 350;
    const fast = dy > 30 && dy / Math.max(1, performance.now() - t0) > 0.5;
    box.classList.remove('dragging');
    box.style.transform = '';
    back.style.opacity = '';
    if ((dy > 110 || fast) && sheet && sheet.box === box) closeSheet();
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
  handle.addEventListener('click', (e) => { if (performance.now() < swallow) { e.stopPropagation(); e.preventDefault(); } }, true);
}

function openPicker(input) {

// 직접 친 시간(24시간): 1~2자리는 시, 3자리는 H+MM, 4자리는 HH+MM, 콜론이 있으면 앞이 시 뒤가 분
function parseTyped(raw) {
  const str = String(raw || '').trim();
  let hh, mm;
  if (str.includes(':')) {
    const [a, b] = str.split(':');
    const ha = a.replace(/\D/g, ''), mb = (b || '').replace(/\D/g, '');
    if (!ha || ha.length > 2 || mb.length > 2) return ha ? '' : null;
    hh = Number(ha); mm = mb ? Number(mb) : 0;
  } else {
    const d = str.replace(/\D/g, '');
    if (!d) return null;
    if (d.length > 4) return '';
    hh = d.length <= 2 ? Number(d) : d.length === 3 ? Number(d[0]) : Number(d.slice(0, 2));
    mm = d.length <= 2 ? 0 : Number(d.slice(-2));
  }
  return hh > 23 || mm > 59 ? '' : `${pad(hh)}:${pad(mm)}`;
}

    if (!edited) return setHint('숫자로 바로 넣어요. 930은 오전 9:30, 1430은 오후 2:30');
    if (v === null) return setHint('비우면 원래 시간 그대로예요');
    if (v === '') return setHint('00:00부터 23:59 사이로 넣어 주세요', 'bad');
    const t = ampm(v), late = future(v);
    setHint(`${t.ap} ${t.hm}${late ? ', 지금보다 늦어요. 어제 기록이면 날짜를 바꿔 주세요' : ''}`, late ? 'bad' : 'ok');
  };
  const startTyping = () => {
    orig = st.time; edited = false;
    show.hidden = true; tin.hidden = false;
    tin.value = st.time.replace(':', '');
    tin.focus(); tin.select();
    typed();
  };
  const finishTyping = (revert) => {
    if (tin.hidden) return;
    if (revert === true) st.time = orig;
    tin.hidden = true; show.hidden = false; setHint('');
    paint();
  };
  wrap.querySelector('.when-btn.time').addEventListener('click', (e) => { if (!tin.hidden || e.target.closest('.tpick')) return; startTyping(); });
  tin.addEventListener('input', () => {
    const c = tin.value.replace(/[^\d:]/g, '');
    if (c !== tin.value) tin.value = c;
    edited = true; typed();
  });
  tin.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); tin.blur(); finishTyping(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finishTyping(true); tin.blur(); }
  });
  tin.addEventListener('blur', () => finishTyping());
  const endTyping = () => { if (!tin.hidden) { tin.blur(); finishTyping(); } };
  // 날짜 달력, 시계, 빠른 버튼
  dIn.addEventListener('change', () => { endTyping(); if (/^\d{4}-\d{2}-\d{2}$/.test(dIn.value)) st.date = dIn.value; paint(); });
  tIn.addEventListener('change', () => { endTyping(); if (/^\d{2}:\d{2}/.test(tIn.value)) st.time = tIn.value.slice(0, 5); paint(); });
  wrap.querySelectorAll('[data-shift]').forEach((b) => b.addEventListener('click', () => {
    endTyping();
    const v = b.dataset.shift;
    let d;
    if (v === 'now') d = new Date();
    else { d = toDate(st.date, st.time); d.setMinutes(d.getMinutes() + Number(v)); }
    st.date = dstr(d); st.time = tstr(d); paint();
  }));
  paint();
  return wrap;
}

function chipRow(options, value, onPick, opts) {

function levelRow(options, value, color, onPick) {

function numberField({ mode, unit, placeholder, value, decimals, huge, onInput, transform }) {
  const box = h('div', { class:`num-input${huge ? ' huge' : ''}` });
  const input = h('input', { type:'text', inputmode:mode === 'int' ? 'numeric' : 'decimal', pattern:mode === 'int' ? '[0-9]*' : null, enterkeyhint:'done', autocomplete:'off', placeholder:placeholder || '', 'aria-label':unit || '숫자' });
  input.value = value == null ? '' : String(value);
  const u = h('span', { class:'unit' }, esc(unit || ''));
  box.appendChild(input); box.appendChild(u);
  input.addEventListener('input', () => {
    let s = input.value.replace(/,/g, '.').replace(mode === 'int' ? /[^0-9]/g : /[^0-9.]/g, '');
    if (mode !== 'int') {
      const i = s.indexOf('.');
      if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, '').slice(0, decimals == null ? 2 : decimals);
    }
    if (transform) s = transform(s);
    if (s !== input.value) input.value = s;
    onInput && onInput(s);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  return { el:box, input, unitEl:u };
}

function wheel(values, initial, onChange) {
  const ITEM = 56;
  const wrap = h('div', { class:'wheel-wrap' });
  const band = h('div', { class:'wheel-band', 'aria-hidden':'true' }, 'ml');
  const el = h('div', { class:'wheel', tabindex:'0', role:'listbox', 'aria-label':'수유량 고르기' });
  el.innerHTML = `<div class="wheel-pad"></div>${values.map((v) => `<div class="wheel-item" role="option" data-v="${v}">${v}</div>`).join('')}<div class="wheel-pad"></div>`;
  wrap.appendChild(el); wrap.appendChild(band);
  const items = Array.from(el.querySelectorAll('.wheel-item'));
  let idx = Math.max(0, values.indexOf(initial));
  let raf = 0, settleTimer = 0;
  const paint = () => {
    const top = el.scrollTop;
    items.forEach((it, i) => {
      it.style.setProperty('--d', Math.min(Math.abs(i * ITEM - top) / ITEM, 2).toFixed(3));
      it.setAttribute('aria-selected', String(i === idx));
    });
  };
  const settle = () => {
    const i = Math.max(0, Math.min(values.length - 1, Math.round(el.scrollTop / ITEM)));
    const changed = i !== idx;
    idx = i;
    paint();
    onChange(values[idx], changed);
  };
  el.addEventListener('scroll', () => {
    cancelAnimationFrame(raf); raf = requestAnimationFrame(paint);
    clearTimeout(settleTimer); settleTimer = setTimeout(settle, 90);
  }, { passive:true });
  items.forEach((it, i) => it.addEventListener('click', () => {
    if (i === idx) onChange(values[idx], true);
    el.scrollTo({ top:i * ITEM, behavior:'smooth' });
  }));
  el.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const ni = Math.max(0, Math.min(values.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1)));
    el.scrollTo({ top:ni * ITEM, behavior:'smooth' });
  });
  return {
    el:wrap,
    mount() { el.scrollTop = idx * ITEM; paint(); },
    get value() { return values[idx]; },
    dim(on) { wrap.classList.toggle('off', !!on); },
  };
}

    <path d="M19 33h22c3.6 4.2 6 9 6 14v59a8 8 0 0 1-8 8H21a8 8 0 0 1-8-8V47c0-5 2.4-9.8 6-14z"/>

const f2 = (n) => Math.round(n * 100) / 100;

const minOf = (t) => { const [hh, mm] = t.split(':').map(Number); return hh * 60 + mm; };

const atText = (r) => { const t = ampm(r.time); return `${md(r.date)} ${t.ap} ${t.hm}`; };
const byTimeAsc = (a, b) => keyOf(a).localeCompare(keyOf(b)) || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));

// 시트에서 받은 전체 기록 + 이 폰에서 고친 기록 - 지운 기록
function chartRecords() {
  const map = new Map();
  if (chartAll) chartAll.list.forEach((r) => map.set(r.id, r));
  const pend = pendingIds();
  for (const id in records) {
    const r = records[id], o = map.get(id);

  }

  const out = [];
  map.forEach((r) => { if (META[r.type] && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && /^\d{2}:\d{2}$/.test(r.time)) out.push(r); });
  return out;

// 날짜별로 모으기
function chartAgg(list) {
  const agg = {};
  const get = (d) => agg[d] || (agg[d] = { feedMl:0, feedN:0, pee:0, poo:0, diaper:0, foodG:0, foodN:0, foods:[], gap:0, gapFrom:null, maxT:null, maxTAt:null });
  const feeds = [];
  list.forEach((r) => {
    const a = get(r.date);
    if (r.type === '수유') { a.feedN++; a.feedMl += Number(r.amount) || 0; feeds.push(r); }
    else if (r.type === '소변대변') { a.diaper++; if (r.pee) a.pee++; if (r.poo) a.poo++; }
    else if (r.type === '이유식') { a.foodN++; a.foodG += Number(r.amount) || 0; a.foods.push(r); }
    else if (r.type === '체온' && hasAmount(r) && (a.maxT == null || Number(r.amount) > a.maxT)) { a.maxT = Number(r.amount); a.maxTAt = r; }
  });
  feeds.sort(byTimeAsc);
  for (let i = 1; i < feeds.length; i++) {
    const g = toDate(feeds[i].date, feeds[i].time) - toDate(feeds[i - 1].date, feeds[i - 1].time);
    if (g <= 0 || g > 18 * 3600000) continue;   // 18시간 넘게 비면 기록이 빠진 것으로 봄
    const a = get(feeds[i].date);
    if (g > a.gap) { a.gap = g; a.gapFrom = feeds[i - 1]; }
  }
  Object.values(agg).forEach((a) => a.foods.sort(byTimeAsc));
  return { agg };
}

// 추이 그래프는 하루가 다 끝난 어제까지
function chartRange(list) {
  const y = addDays(todayStr(), -1);
  if (chartPrefs.period !== 'all') return { from:addDays(y, 1 - Number(chartPrefs.period)), to:y };
  let first = y;
  list.forEach((r) => { if (r.date < first) first = r.date; });
  return { from:daysBetween(first, y) < 6 ? addDays(y, -6) : first, to:y };
}
const dayList = (from, to) => { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; };

// 날마다의 값과 7일 평균(그날 포함 앞 7일 중 기록 있는 날이 4일 이상일 때)
function daySeries(ctx, pick, has) {
  const ext = dayList(addDays(ctx.from, -6), ctx.to);
  const raw = ext.map((d) => { const a = ctx.agg[d]; return a && has(a) ? pick(a) : null; });
  const vals = [], avg = [];
  for (let i = 6; i < raw.length; i++) {
    vals.push(raw[i]);
    const w = raw.slice(i - 6, i + 1).filter((v) => v != null);
    avg.push(w.length >= 4 ? w.reduce((a, b) => a + b, 0) / w.length : null);
  }
  return { vals, avg };
}
// 최근 7일(어제까지) 평균과 그 전 7일 평균
function weekCompare(ctx, pick, has) {
  const y = addDays(todayStr(), -1);
  const mean = (a, b) => {
    const v = dayList(a, b).map((d) => ctx.agg[d]).filter((x) => x && has(x)).map(pick);
    return v.length ? v.reduce((s, t) => s + t, 0) / v.length : null;
  };
  return { last:mean(addDays(y, -6), y), prev:mean(addDays(y, -13), addDays(y, -7)) };
}

function niceTicks(lo, hi, want, int, steps) {
  const raw = Math.max(hi - lo, int ? 1 : 1e-6) / (want || 3);
  let step;
  if (steps) step = steps.find((x) => x >= raw) || steps[steps.length - 1];
  else {
    const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    step = (f <= 1 ? 1 : f <= 2 ? 2 : (f <= 2.5 && !int) ? 2.5 : f <= 5 ? 5 : 10) * p;
    if (int) step = Math.max(1, Math.round(step));
  }
  const a = Math.floor(lo / step + 1e-9) * step;
  let b = Math.ceil(hi / step - 1e-9) * step;
  if (b <= a) b = a + step;
  const ticks = [];
  for (let v = a; v <= b + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo:a, hi:b, ticks };
}
function stepTicks(lo, hi, steps) {
  for (const st of steps) {
    const a = Math.floor(lo / st + 1e-9) * st, b = Math.max(a + st, Math.ceil(hi / st - 1e-9) * st);
    if ((b - a) / st <= 4 || st === steps[steps.length - 1]) {
      const ticks = [];
      for (let v = a; v <= b + st / 2; v += st) ticks.push(v);
      return { lo:a, hi:b, ticks };
    }
  }
}
function xLabelsSvg(items, x0, x1, y) {
  return items.map(({ x, text }) => {
    const half = textW(text) / 2;
    let anchor = 'middle', xx = x;
    if (x + half > x1) { anchor = 'end'; xx = x1; } else if (x - half < x0) { anchor = 'start'; xx = x0; }
    return `<text class="ax" x="${f2(xx)}" y="${y}" text-anchor="${anchor}">${esc(text)}</text>`;
  }).join('');
}
function dayLabels(from, n) {
  const t = todayStr(), y = addDays(t, -1), step = n <= 8 ? 1 : Math.ceil(n / 5), out = [];
  for (let i = n - 1; i >= 0; i -= step) { const d = addDays(from, i); out.push({ i, text:d === t ? '오늘' : d === y ? '어제' : mdShort(d) }); }
  return out;
}
const svgWrap = (W, H, aria, inner) => h('div', { class:'chart' }, `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${inner}</svg>`);
function nearest(pts, x, y, maxD, wy) {
  let best = null, bd = Infinity;
  pts.forEach((p, i) => {
    const dx = p.x - x, dy = (p.y - y) * (wy == null ? 1 : wy);
    if (Math.abs(dx) > maxD) return;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

// 손가락: 톡 누르면 고르고 다시 누르면 풀기, 옆으로 밀면 따라가기, 위아래로 밀면 그냥 스크롤
// 마우스: 올리면 보이고 벗어나면 사라짐
function wire(svg, hit, onPick, state) {
  const st = state || { cur:null };
  let down = null;
  const at = (e) => { const r = svg.getBoundingClientRect(); return hit(e.clientX - r.left, e.clientY - r.top); };
  const set = (k) => { if (k === st.cur) return; st.cur = k; onPick(k); };
  svg.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') { set(at(e)); return; }
    down = { x:e.clientX, y:e.clientY, scrub:false };
  });
  svg.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') { const k = at(e); if (k != null) set(k); return; }
    if (!down) return;
    if (!down.scrub && Math.abs(e.clientX - down.x) > 8 && Math.abs(e.clientX - down.x) > Math.abs(e.clientY - down.y)) down.scrub = true;
    if (down.scrub) { const k = at(e); if (k != null) set(k); }
  });
  svg.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse' || !down) return;
    const scrubbed = down.scrub;
    down = null;
    if (scrubbed) return;
    const k = at(e);
    set(k != null && k === st.cur ? null : k);
  });
  svg.addEventListener('pointercancel', () => { down = null; });
  svg.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') set(null); });
  return st;
}
function readout() {
  const el = h('div', { class:'readout' }, '<span class="rl"></span><span class="rv"></span>');
  const rl = el.children[0], rv = el.children[1];
  return { el, set(label, value, soft) { rl.textContent = label; rv.innerHTML = value || '&nbsp;'; rv.classList.toggle('soft', !!soft); } };
}
function seg(options, value, onPick, small) {

  const draw = () => { el.innerHTML = options.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${v === value}">${esc(t)}</button>`).join(''); };

const card = (title, sub) => h('section', { class:'cset' }, `<h3>${esc(title)}${sub ? ` <small>${esc(sub)}</small>` : ''}</h3>`);
const emptyLine = (text) => h('p', { class:'cempty' }, esc(text));
const swatch = (c, dot) => `<i class="swatch${dot ? ' dot' : ''}" style="background:var(--${c})"></i>`;


// 꺾은선: 7일 이하면 날마다 점, 길면 연한 하루 값 위에 굵은 7일 평균
function trendChart(o) {
  const { W, H, days, series, smooth } = o, n = days.length;
  const T = 16, B = 24, PH = H - T - B, pw = W - CL - CR;
  const xi = (i) => CL + ((i + 0.5) / n) * pw;
  const nums = [];
  series.forEach((sr) => { sr.vals.concat(smooth ? sr.avg : []).forEach((v) => { if (v != null) nums.push(v); }); });
  const lo = o.zero ? 0 : Math.min(...nums), hi = Math.max(...nums);
  const tk = o.steps ? stepTicks(lo, hi, o.steps) : niceTicks(lo, hi, 3, o.int);
  const y = (v) => T + PH - ((v - tk.lo) / (tk.hi - tk.lo)) * PH;
  let s = '';
  tk.ticks.forEach((t) => {
    const yy = Math.round(y(t)) + 0.5;
    s += `<line class="grid" x1="${CL}" x2="${W - CR}" y1="${yy}" y2="${yy}"/><text class="ax" x="${CL - 7}" y="${yy + 4}" text-anchor="end">${esc(o.fmtY(t))}</text>`;
  });
  s += xLabelsSvg(dayLabels(days[0], n).map((l) => ({ x:xi(l.i), text:l.text })), 2, W - 1, H - 6);
  s += `<line class="xh" x1="0" x2="0" y1="${T - 8}" y2="${T + PH}" visibility="hidden"/>`;
  const path = (vals) => {
    let d = '', up = true;
    vals.forEach((v, i) => { if (v == null) { up = true; return; } d += `${up ? 'M' : 'L'}${f2(xi(i))} ${f2(y(v))}`; up = false; });
    return d;
  };
  series.forEach((sr) => {
    const c = `var(--${sr.color})`;
    if (smooth) {
      s += `<path class="day" d="${path(sr.vals)}" style="stroke:${c}"/><path class="avg" d="${path(sr.avg)}" style="stroke:${c}"/>`;
    } else {
      s += `<path class="avg thin" d="${path(sr.vals)}" style="stroke:${c}"/>`;
      sr.vals.forEach((v, i) => { if (v != null) s += `<circle cx="${f2(xi(i))}" cy="${f2(y(v))}" r="4" style="fill:${c};stroke:var(--surface);stroke-width:2"/>`; });
    }
  });
  series.forEach((sr) => { s += `<circle class="hp" r="5" style="fill:var(--${sr.color});stroke:var(--surface);stroke-width:2" visibility="hidden"/>`; });
  const el = svgWrap(W, H, o.aria || '', s);
  const svg = el.firstChild, xh = svg.querySelector('.xh'), hps = Array.from(svg.querySelectorAll('.hp'));
  return {
    el, svg,
    hit:(x) => (x < CL - 12 || x > W ? null : Math.max(0, Math.min(n - 1, Math.floor(((x - CL) / pw) * n)))),
    mark(i) {
      if (i == null) { xh.setAttribute('visibility', 'hidden'); hps.forEach((c) => c.setAttribute('visibility', 'hidden')); return; }
      const xx = f2(xi(i));
      xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('visibility', 'visible');
      hps.forEach((c, k) => {
        const v = series[k].vals[i];
        if (v == null) { c.setAttribute('visibility', 'hidden'); return; }
        c.setAttribute('cx', xx); c.setAttribute('cy', f2(y(v))); c.setAttribute('visibility', 'visible');
      });
    },
  };
}

const valHtml = (m, v) => (m.hours ? hmHtml(v * 3600000) : `<span class="num">${nf(v, m.dec)}</span>${m.unit}`);
const valText = (m, v) => (m.hours ? hmText(v * 3600000) : `${nf(v, m.dec)}${m.unit}`);

const lineSw = (c) => `<i class="swatch line" style="background:var(--${c})"></i>`;

const FEED_METRICS = [
  { title:'하루 수유량', pick:(a) => a.feedMl, has:(a) => a.feedN > 0, unit:'ml', dec:0, same:10, detail:(a) => `${a.feedN}회` },
  { title:'1회 수유량', pick:(a) => a.feedMl / a.feedN, has:(a) => a.feedN > 0 && a.feedMl > 0, unit:'ml', dec:0, same:3, detail:(a) => `${a.feedN}회, 하루 ${nf(a.feedMl)}ml` },

    detail:(a, d) => { const p = ampm(a.gapFrom.time); return `${a.gapFrom.date !== d ? '전날 ' : ''}${p.ap} ${p.hm}부터`; } },

function trendCard(ctx, m) {
  const sec = card(m.title);
  const sr = daySeries(ctx, m.pick, m.has);
  if (!sr.vals.some((v) => v != null)) { sec.appendChild(emptyLine(m.empty || '이 기간에는 기록이 없어요.')); return sec; }
  const ro = readout();
  const smooth = ctx.smooth && !m.noSmooth;
  const ch = trendChart({ W:ctx.W, H:m.H || 150, days:ctx.days, series:[{ vals:sr.vals, avg:sr.avg, color:m.color || 'cv-feed' }], smooth,
    fmtY:m.fmtY || ((t) => nf(t, 1)), int:m.int, steps:m.steps, zero:m.zero, aria:`${m.title} 추이 꺾은선그래프` });
  const cmp = weekCompare(ctx, m.pick, m.has), ct = changeText(m, cmp), avgLabel = m.avgLabel || '최근 7일 평균';
  const def = () => (cmp.last != null
    ? ro.set(avgLabel, `${valHtml(m, cmp.last)}${ct ? `<span class="rs">, ${ct}</span>` : ''}`)
    : ro.set(avgLabel, '최근 7일에는 기록이 없어요', true));
  const show = (i) => {
    ch.mark(i);
    if (i == null) return def();
    const d = ctx.days[i], v = sr.vals[i], av = sr.avg[i];
    const label = `${dayName(d)}${smooth && av != null ? `, 7일 평균 ${valText(m, av)}` : ''}`;
    if (v == null) return ro.set(label, '기록 없음', true);
    ro.set(label, `${valHtml(m, v)}${m.detail ? `<span class="rs">, ${esc(m.detail(ctx.agg[d], d))}</span>` : ''}`);
  };
  def();
  wire(ch.svg, ch.hit, show);
  sec.append(ro.el, ch.el);
  return sec;
}

function diaperCard(ctx) {
  const sec = card('소변과 대변');
  const has = (a) => a.diaper > 0, pk = (a) => a.pee, qk = (a) => a.poo;
  const P = daySeries(ctx, pk, has), Q = daySeries(ctx, qk, has);
  if (!P.vals.some((v) => v != null)) { sec.appendChild(emptyLine('이 기간에는 소변과 대변 기록이 없어요.')); return sec; }
  const ro = readout();
  const ch = trendChart({ W:ctx.W, H:170, days:ctx.days, series:[{ vals:P.vals, avg:P.avg, color:'cv-pee' }, { vals:Q.vals, avg:Q.avg, color:'cv-poo' }],
    smooth:ctx.smooth, fmtY:(t) => nf(t), int:true, zero:true, aria:'소변과 대변 횟수 추이 꺾은선그래프' });
  const cp = weekCompare(ctx, pk, has), cq = weekCompare(ctx, qk, has);
  const both = (p, q, dec) => `소변 <span class="num">${nf(p, dec)}</span>회<span class="rs">, </span>대변 <span class="num">${nf(q, dec)}</span>회`;
  const def = () => (cp.last != null ? ro.set('최근 7일 하루 평균', both(cp.last, cq.last, 1)) : ro.set('최근 7일 하루 평균', '최근 7일에는 기록이 없어요', true));
  const show = (i) => {
    ch.mark(i);
    if (i == null) return def();
    const d = ctx.days[i];
    if (P.vals[i] == null) return ro.set(dayName(d), '기록 없음', true);
    ro.set(ctx.smooth && P.avg[i] != null ? `${dayName(d)}, 7일 평균 소변 ${nf(P.avg[i], 1)}회 대변 ${nf(Q.avg[i], 1)}회` : dayName(d), both(P.vals[i], Q.vals[i], 0));
  };
  def();
  wire(ch.svg, ch.hit, show);
  sec.append(ro.el, ch.el, h('div', { class:'legend' }, `<span>${lineSw('cv-pee')}소변</span><span>${lineSw('cv-poo')}대변</span>`));
  return sec;
}

function foodCard(ctx) {

  return trendCard(ctx, {
    title:'이유식', color:'cv-food', noSmooth:true, zero:true, int:true, H:140, empty:'이 기간에는 이유식 기록이 없어요.',
    pick:grams ? (a) => a.foodG : (a) => a.foodN, has:(a) => a.foodN > 0, unit:grams ? 'g' : '번', dec:grams ? 0 : 1, same:grams ? 3 : 0.3,
    avgLabel:'최근 7일, 먹은 날 평균', fmtY:(t) => nf(t),

  });
